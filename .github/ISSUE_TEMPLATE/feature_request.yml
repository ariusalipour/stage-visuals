name: Feature request
description: Suggest an improvement to the desktop editor.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the workflow or problem this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: true
